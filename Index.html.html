<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MINDCRAFT Online Academy - Weekly Mock Exam</title>
<style>
:root{--p:#5b21b6;--p2:#7c3aed;--pd:#3b0f7a;--pl:#f3edff;--line:#e4d9fb;--ok:#15803d;--bad:#b91c1c}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Arial,sans-serif;background:#faf7ff;color:#1f1535;line-height:1.5}
.top{background:linear-gradient(135deg,var(--pd),var(--p2));color:#fff;text-align:center;padding:14px 10px;font-weight:800;letter-spacing:1px;font-size:1rem}
.wrap{max-width:760px;margin:0 auto;padding:14px}
.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:14px;box-shadow:0 2px 8px rgba(91,33,182,.08)}
.hero{text-align:center;padding:28px 18px}
.hero h1{margin:0 0 4px;color:var(--p);font-size:1.7rem;line-height:1.2}
.hero h2{margin:0 0 10px;color:var(--p2);font-size:1.15rem}
.muted{color:#6b5b8f;font-size:.92rem}
label{display:block;text-align:left;font-weight:600;margin:14px 0 6px}
input[type=text]{width:100%;padding:12px;border:2px solid var(--line);border-radius:10px;font-size:1rem}
input[type=text]:focus{outline:none;border-color:var(--p2)}
.btn{background:var(--p);color:#fff;border:0;border-radius:10px;padding:13px 20px;font-size:1rem;font-weight:700;cursor:pointer;width:100%;margin-top:14px}
.btn:hover{background:var(--pd)}
.btn:disabled{background:#c4b5e6;cursor:not-allowed}
.btn.alt{background:#fff;color:var(--p);border:2px solid var(--p)}
.btn.sm{width:auto;margin:0;padding:10px 16px}
.sub{display:flex;align-items:center;gap:12px;border:2px solid var(--line);border-radius:12px;padding:13px;margin-bottom:10px;cursor:pointer;background:#fff}
.sub.on{border-color:var(--p);background:var(--pl)}
.sub.lock{cursor:default}
.sub .tick{width:24px;height:24px;border-radius:6px;border:2px solid var(--p2);display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;flex:none}
.sub.on .tick{background:var(--p)}
.sub small{display:block;color:#6b5b8f}
.tag{background:var(--p);color:#fff;border-radius:20px;padding:2px 10px;font-size:.75rem;margin-left:auto}
ol.rules{padding-left:20px}
ol.rules li{margin-bottom:9px}
.good{text-align:center;font-weight:800;color:var(--p);font-size:1.15rem;margin-top:14px}
.bar{position:sticky;top:0;z-index:5;background:var(--pd);color:#fff;display:flex;justify-content:space-between;align-items:center;padding:10px 14px;font-weight:700}
.bar .tm{font-size:1.25rem;font-variant-numeric:tabular-nums;background:#fff;color:var(--pd);border-radius:8px;padding:3px 10px}
.bar .tm.warn{background:#fee2e2;color:var(--bad)}
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;margin-bottom:10px}
.tabs button{flex:none;border:2px solid var(--line);background:#fff;color:var(--p);border-radius:20px;padding:7px 14px;font-weight:700;cursor:pointer}
.tabs button.on{background:var(--p);color:#fff;border-color:var(--p)}
.passage{background:var(--pl);border-left:4px solid var(--p2);padding:12px 14px;border-radius:8px;margin-bottom:12px;font-size:.95rem}
.q{font-weight:700;margin:6px 0 12px;font-size:1.05rem}
.opt{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;border:2px solid var(--line);background:#fff;border-radius:10px;padding:11px;margin-bottom:9px;font-size:1rem;cursor:pointer;color:#1f1535}
.opt b{background:var(--pl);color:var(--p);border-radius:6px;width:26px;height:26px;display:flex;align-items:center;justify-content:center;flex:none}
.opt.sel{border-color:var(--p);background:var(--pl)}
.opt.sel b{background:var(--p);color:#fff}
.nav{display:flex;justify-content:space-between;gap:10px;margin-top:6px}
.pal{display:grid;grid-template-columns:repeat(6,1fr);gap:7px;margin-top:8px}
.pal button{border:2px solid var(--line);background:#fff;border-radius:8px;padding:8px 0;font-weight:700;cursor:pointer;color:var(--p)}
.pal button.ans{background:var(--p2);color:#fff;border-color:var(--p2)}
.pal button.cur{outline:3px solid var(--pd)}
.alert{background:#fff7ed;border:1px solid #fdba74;color:#9a3412;padding:9px 12px;border-radius:10px;margin-bottom:10px;font-size:.9rem}
.score{text-align:center}
.big{font-size:2.6rem;font-weight:800;color:var(--p);line-height:1.1}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.mini{background:var(--pl);border-radius:10px;padding:10px;text-align:center}
.mini b{display:block;font-size:1.3rem;color:var(--p)}
.cq{border-top:1px solid var(--line);padding:14px 0}
.cq .opt{cursor:default;padding:9px}
.opt.right{border-color:var(--ok);background:#f0fdf4}
.opt.right b{background:var(--ok);color:#fff}
.opt.wrong{border-color:var(--bad);background:#fef2f2}
.opt.wrong b{background:var(--bad);color:#fff}
.st{font-size:.85rem;font-weight:700}
.st.r{color:var(--ok)}.st.w{color:var(--bad)}.st.n{color:#92400e}
.exp{background:var(--pl);border-radius:8px;padding:8px 10px;font-size:.92rem;margin-top:4px}
.mdl{position:fixed;inset:0;background:rgba(30,10,60,.6);z-index:99;display:flex;align-items:center;justify-content:center;padding:20px}
.mdl .card{max-width:380px;width:100%;margin:0;text-align:center}
footer{background:var(--pd);color:#fff;text-align:center;padding:18px 12px;margin-top:20px;font-size:.95rem}
footer a{color:#e9d5ff;text-decoration:none;font-weight:700;display:inline-block;margin:3px 8px}
</style>
</head>

},

const OPTIONAL = ["maths","biology","chemistry","physics"];
const DESC = {
  english:"Comprehension, synonyms, antonyms, lexis and structure, summary, question tags",
  maths:"Number bases; fractions, decimals, approximations and percentages; indices, logarithms and surds",
  biology:"Living organisms, cells, cell theory, types of cells, uni/multicellular organisms, organelles",
  chemistry:"Separation of mixtures; chemical combination; kinetic theory and gas laws",
  physics:"Measurements and units; scalars and vectors; motion"
};
const LETTERS = ["A","B","C","D"];
let student="", chosen=[], exam=[], si=0, qi=0, endAt=0, timer=null, active=false, leaves=0;

const app = document.getElementById("app");
const foot = document.getElementById("foot");

function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}

/* In-page pop-up (works everywhere, unlike alert/confirm) */
let mcb = null;
function modal(msg, okText, cb, cancelText){
  closeModal(); mcb = cb || null;
  const d = document.createElement("div"); d.id = "mdl"; d.className = "mdl";
  d.innerHTML = '<div class="card"><p style="font-weight:700;margin-top:0">' + esc(msg) + '</p><div class="nav">' +
    (cancelText ? '<button class="btn alt sm" onclick="closeModal()">' + esc(cancelText) + '</button>' : '') +
    '<button class="btn sm" onclick="modalOk()">' + esc(okText) + '</button></div></div>';
  document.body.appendChild(d);
}
function closeModal(){ const m = document.getElementById("mdl"); if(m) m.remove(); }
function modalOk(){ const c = mcb; mcb = null; closeModal(); if(c) c(); }

function setFooter(show){
  foot.style.display = show ? "block" : "none";
  foot.innerHTML = "<div><b>Contact MINDCRAFT ONLINE ACADEMY</b></div>" +
    '<a href="tel:' + esc(CONTACT.phone.replace(/\s/g,"")) + '">\u260e ' + esc(CONTACT.phone) + '</a>' +
    '<a href="https://wa.me/' + esc(CONTACT.whatsapp) + '" target="_blank" rel="noopener">WhatsApp</a>' +
    (CONTACT.email ? '<a href="mailto:' + esc(CONTACT.email) + '">' + esc(CONTACT.email) + '</a>' : '');
}

/* ---------- SCREEN 1: FRONT PAGE ---------- */
function home(){
  setFooter(true);
  app.innerHTML =
   '<div class="card hero">' +
   '<h1>MINDCRAFT ONLINE ACADEMY</h1>' +
   '<h2>Weekly Mock Exam</h2>' +
   '<p class="muted">English \u2022 Biology \u2022 Physics \u2022 Chemistry \u2022 Mathematics</p>' +
   '<label for="nm">Enter your full name</label>' +
   '<input type="text" id="nm" placeholder="e.g. Chinedu Okafor" value="' + esc(student) + '" autocomplete="name">' +
   '<button class="btn" onclick="toSubjects()">Continue</button>' +
   '</div>';
}

/* ---------- SCREEN 2: CHOOSE SUBJECTS ---------- */
function toSubjects(){
  const v = document.getElementById("nm");
  if(v){ student = v.value.trim(); }
  if(student.length < 2){ modal("Please enter your full name to continue.", "OK"); return; }
  renderSubjects();
}
function renderSubjects(){
  setFooter(true);
  let h = '<div class="card"><h2 style="margin-top:0;color:var(--p)">Hello, ' + esc(student) + '</h2>' +
    '<p>English is <b>compulsory</b>. Choose <b>3</b> more subjects.</p>' +
    '<div class="sub on lock"><div class="tick">\u2713</div><div><b>English Language</b><small>' + DESC.english + '</small></div><span class="tag">Compulsory</span></div>';
  OPTIONAL.forEach(function(k){
    const on = chosen.indexOf(k) > -1;
    h += '<div class="sub ' + (on?"on":"") + '" onclick="toggleSub(\'' + k + '\')"><div class="tick">' + (on?"\u2713":"") + '</div><div><b>' + BANK[k].name + '</b><small>' + DESC[k] + '</small></div></div>';
  });
  h += '<p class="muted" style="text-align:center">Selected: <b>' + chosen.length + '/3</b></p>' +
    '<button class="btn" ' + (chosen.length===3?"":"disabled") + ' onclick="toRules()">Proceed</button>' +
    '<button class="btn alt" onclick="home()">Back</button></div>';
  app.innerHTML = h;
}
function toggleSub(k){
  const i = chosen.indexOf(k);
  if(i > -1){ chosen.splice(i,1); }
  else if(chosen.length < 3){ chosen.push(k); }
  else { modal("You can only choose 3 subjects besides English. Untick one first.", "OK"); return; }
  renderSubjects();
}

/* ---------- SCREEN 3: RULES ---------- */
function toRules(){
  setFooter(true);
  const names = ["English Language"].concat(chosen.map(function(k){return BANK[k].name;}));
  app.innerHTML =
   '<div class="card"><h2 style="margin-top:0;color:var(--p)">Exam Rules</h2>' +
   '<p><b>Your subjects:</b> ' + names.join(", ") + '</p>' +
   '<ol class="rules">' +
   '<li>Your exam is <b>2 hours (120 minutes)</b>.</li>' +
   '<li>Once you click <b>Start Exam</b>, the exam starts <b>immediately</b> and the timer cannot be paused.</li>' +
   '<li>Each subject has <b>30 questions</b> with 4 options (A to D), making <b>120 questions</b> in all.</li>' +
   '<li><b>Do not leave this site</b> during the exam. Switching tabs or apps is recorded.</li>' +
   '<li>Do not refresh or close the page, or you will lose your progress.</li>' +
   '<li>The exam submits automatically when the time is up.</li>' +
   '<li><b>Corrections</b> will be shown after you finish the mock.</li>' +
   '</ol>' +
   '<div class="good">GOODLUCK on your MOCK!</div>' +
   '<button class="btn" onclick="startExam()">Start Exam</button>' +
   '<button class="btn alt" onclick="renderSubjects()">Back</button></div>';
}

/* ---------- EXAM ---------- */
function buildSubject(k){
  const d = BANK[k];
  return {
    key:k, name:d.name, passages:d.passages||{}, ans:[],
    qs: d.qs.map(function(r){
      const opts = shuffle(r[1].map(function(t,i){return {t:t, c:i===r[2]};}));
      return {t:r[0], opts:opts, e:r[3]||"", p:r[4]||""};
    })
  };
}
function startExam(){
  exam = ["english"].concat(chosen).map(buildSubject);
  si = 0; qi = 0; leaves = 0; active = true;
  endAt = Date.now() + EXAM_MINUTES*60*1000;
  setFooter(false);
  clearInterval(timer);
  timer = setInterval(tick, 1000);
  renderExam();
}
function fmt(ms){
  const s = Math.max(0, Math.floor(ms/1000));
  const h = Math.floor(s/3600), m = Math.floor((s%3600)/60), x = s%60;
  return String(h).padStart(2,"0")+":"+String(m).padStart(2,"0")+":"+String(x).padStart(2,"0");
}
function tick(){
  const left = endAt - Date.now();
  const el = document.getElementById("tm");
  if(el){ el.textContent = fmt(left); el.className = "tm" + (left < 10*60*1000 ? " warn" : ""); }
  if(left <= 0){ clearInterval(timer); finish(); modal("Time is up! Your exam has been submitted automatically.", "See my result"); }
}
function answeredCount(){ let n=0; exam.forEach(function(s){ s.ans.forEach(function(a){ if(a!==undefined) n++; }); }); return n; }

function renderExam(){
  const y = window.scrollY;
  const s = exam[si], q = s.qs[qi];
  let h = '<div class="bar"><span>Answered: ' + answeredCount() + '/' + (exam.length*30) + '</span><span class="tm" id="tm">' + fmt(endAt-Date.now()) + '</span></div><div class="wrap" style="padding:10px 0">';
  if(leaves > 0){ h += '<div class="alert">\u26a0 You left the exam page ' + leaves + ' time(s). Please stay on this site.</div>'; }
  h += '<div class="tabs">';
  exam.forEach(function(sub,i){
    let a = 0; sub.ans.forEach(function(v){ if(v!==undefined) a++; });
    h += '<button class="' + (i===si?"on":"") + '" onclick="goSub(' + i + ')">' + sub.name.replace(" Language","") + ' (' + a + '/30)</button>';
  });
  h += '</div><div class="card">';
  h += '<div class="muted">' + s.name + ' \u2022 Question ' + (qi+1) + ' of 30</div>';
  if(q.p){ h += '<div class="passage" style="margin-top:10px"><b>Read the passage and answer the questions.</b><br>' + esc(s.passages[q.p]) + '</div>'; }
  h += '<div class="q">' + esc(q.t) + '</div>';
  q.opts.forEach(function(o,i){
    h += '<button class="opt ' + (s.ans[qi]===i?"sel":"") + '" onclick="pick(' + i + ')"><b>' + LETTERS[i] + '</b><span>' + esc(o.t) + '</span></button>';
  });
  h += '<div class="nav"><button class="btn sm alt" ' + (qi===0?"disabled":"") + ' onclick="move(-1)">Previous</button>' +
       '<button class="btn sm" ' + (qi===29?"disabled":"") + ' onclick="move(1)">Next</button></div></div>';
  h += '<div class="card"><b>Question navigator</b><div class="pal">';
  for(let i=0;i<30;i++){
    h += '<button class="' + (s.ans[i]!==undefined?"ans ":"") + (i===qi?"cur":"") + '" onclick="goQ(' + i + ')">' + (i+1) + '</button>';
  }
  h += '</div></div><button class="btn" onclick="submitExam()">Submit Exam</button></div>';
  app.innerHTML = h;
  window.scrollTo(0,y);
}
function pick(i){ exam[si].ans[qi] = i; renderExam(); }
function move(d){ qi = Math.min(29, Math.max(0, qi+d)); renderExam(); window.scrollTo(0,0); }
function goQ(i){ qi = i; renderExam(); window.scrollTo(0,0); }
function goSub(i){ si = i; qi = 0; renderExam(); window.scrollTo(0,0); }
function submitExam(){
  const left = exam.length*30 - answeredCount();
  const msg = left > 0 ? ("You have " + left + " unanswered question(s). Submit anyway?") : "Submit your exam now?";
  modal(msg, "Yes, Submit", finish, "Go back");
}

/* ---------- RESULTS ---------- */
function isRight(s,i){ const a = s.ans[i]; return a!==undefined && s.qs[i].opts[a].c; }
function finish(){
  clearInterval(timer); active = false;
  window.scrollTo(0,0);
  setFooter(true);
  let total = 0, jamb = 0, grid = "";
  exam.forEach(function(s){
    let sc = 0; for(let i=0;i<30;i++){ if(isRight(s,i)) sc++; }
    s.score = sc; total += sc; jamb += (sc/30)*100;
    grid += '<div class="mini"><b>' + sc + '/30</b>' + s.name.replace(" Language","") + '</div>';
  });
  const pct = Math.round(total/120*100);
  let remark = pct>=70 ? "Excellent work!" : pct>=50 ? "Good effort. Keep practising!" : "Keep studying. You will improve next week!";
  app.innerHTML =
   '<div class="card score"><div class="muted">Mock completed for</div><h2 style="margin:4px 0;color:var(--p)">' + esc(student) + '</h2>' +
   '<div class="big">' + Math.round(jamb) + '/400</div><div class="muted">Total correct: <b>' + total + '/120</b> \u2022 ' + pct + '%</div>' +
   '<p><b>' + remark + '</b></p><div class="grid">' + grid + '</div>' +
   '<button class="btn" onclick="showCorrections(0)">View Corrections</button>' +
   '<button class="btn alt" onclick="restart()">Back to Start</button></div>';
}
function restart(){ chosen = []; exam = []; home(); }

function showCorrections(idx){
  window.scrollTo(0,0);
  const s = exam[idx];
  let h = '<div class="card"><h2 style="margin-top:0;color:var(--p)">Corrections</h2><div class="tabs">';
  exam.forEach(function(sub,i){ h += '<button class="' + (i===idx?"on":"") + '" onclick="showCorrections(' + i + ')">' + sub.name.replace(" Language","") + ' (' + sub.score + '/30)</button>'; });
  h += '</div>';
  let lastP = "";
  s.qs.forEach(function(q,i){
    h += '<div class="cq">';
    if(q.p && q.p !== lastP){ h += '<div class="passage"><b>Passage</b><br>' + esc(s.passages[q.p]) + '</div>'; lastP = q.p; }
    const a = s.ans[i];
    const st = a===undefined ? '<span class="st n">Not answered</span>' : (q.opts[a].c ? '<span class="st r">\u2713 Correct</span>' : '<span class="st w">\u2717 Wrong</span>');
    h += '<div class="q">' + (i+1) + '. ' + esc(q.t) + '</div>' + st + '<div style="margin-top:8px">';
    q.opts.forEach(function(o,j){
      let c = "opt";
      if(o.c) c += " right"; else if(a===j) c += " wrong";
      h += '<div class="' + c + '"><b>' + LETTERS[j] + '</b><span>' + esc(o.t) + (a===j ? " (your answer)" : "") + '</span></div>';
    });
    h += '</div>';
    if(q.e){ h += '<div class="exp"><b>Explanation:</b> ' + esc(q.e) + '</div>'; }
    h += '</div>';
  });
  h += '<button class="btn" onclick="finish()">Back to Results</button></div>';
  app.innerHTML = h;
}

/* ---------- ANTI-LEAVE PROTECTION ---------- */
window.addEventListener("beforeunload", function(e){
  if(active){ e.preventDefault(); e.returnValue = ""; return ""; }
});
document.addEventListener("visibilitychange", function(){
  if(active && document.hidden){ leaves++; }
  else if(active && !document.hidden){ renderExam(); }
});

home();
</script>
</body>
</html>
